# SwiftLint — MadridInGameiOSModule
# Calibrado para un codebase heredado: severidad progresiva, no bloquear por deuda existente.

included:
  - Sources

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - todo                    # gestionados vía docs/BACKLOG.md
  - identifier_name         # el codebase heredado mezcla estilos; activar tras limpieza
  - type_name

line_length:
  warning: 160
  error: 250
  ignores_comments: true

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 400
  error: 800

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 15
  error: 25

force_unwrapping:
  severity: warning
